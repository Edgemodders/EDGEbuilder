<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remove Doors brand</title>
<!-- The source of Remove Doors' brand images, in the style of REDnode's app packs
     (REDnode/packs/admin-tools/nexus/brand/source.html). tools/brand/render.cjs draws it at each
     size: #banner (2560 x 640), #social and #nexus (1280 x 640), #icon (256 x 256). -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #08090d; --panel: #10131b; --line: #262c3d; --fg: #e3e6ee; --dim: #8a93a8;
    --yellow: #fcee0a; --cyan: #19f3ff; --green: #5dffa1; --red: #ff4d6d;
    --display: "Chakra Petch", sans-serif; --body: "Rajdhani", sans-serif; --mono: "JetBrains Mono", monospace; }
  html, body { margin: 0; overflow: hidden; background: var(--bg); }
  .art { position: relative; overflow: hidden; background:
      radial-gradient(ellipse at 0% 100%, rgba(252, 238, 10, .08), transparent 55%),
      linear-gradient(rgba(25, 243, 255, .045) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(25, 243, 255, .045) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg); }
  .corner { position: absolute; width: 58px; height: 58px; border: 0 solid var(--yellow); }
  .corner.tl { left: 32px; top: 32px; border-left-width: 3px; border-top-width: 3px; }
  .corner.br { right: 32px; bottom: 32px; border-right-width: 3px; border-bottom-width: 3px; }
  .kicker { font: 500 28px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; }
  .title { font: 700 186px/0.9 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--fg); white-space: nowrap; }
  .title b { color: var(--yellow); font-weight: 700; }
  .tag { font: 500 46px/1.25 var(--body); color: #c9cfdd; }
  .rule { height: 4px; background: var(--line); position: relative; }
  .rule::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18%; background: var(--yellow); }
  .panel { background: var(--panel); border: 1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px)); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 40px; font: 500 22px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .row span:first-child { color: var(--dim); }
  .row + .row { border-top: 2px solid var(--line); }
  .c { color: var(--cyan); } .y { color: var(--yellow); } .g { color: var(--green); } .r { color: var(--red); }

  /* A row of doorways on a floor line: outlined doors, the picked one red, a removed one left open. */
  .doors { position: absolute; display: flex; align-items: flex-end; border-bottom: 3px solid var(--line); }
  .doors i { display: block; position: relative; box-sizing: border-box; border: 3px solid var(--cyan); border-bottom: 0; opacity: .75; }
  .doors i::after { content: ""; position: absolute; right: 18%; top: 52%; width: 10%; height: 4%; min-width: 4px; min-height: 3px; background: currentColor; color: var(--cyan); }
  .doors i.picked { border-color: var(--red); opacity: 1; box-shadow: 0 0 18px rgba(255, 77, 109, .55); }
  .doors i.picked::after { color: var(--red); }
  .doors i.gone { border: 3px dashed var(--dim); border-bottom: 0; opacity: .5; }
  .doors i.gone::after { display: none; }

  /* banner: 2560 x 640 */
  #banner { width: 2560px; height: 640px; }
  #banner .text { position: absolute; left: 112px; top: 96px; width: 1300px; }
  #banner .title { margin: 26px 0 30px; }
  #banner .tag { max-width: 940px; }
  #banner .rule { margin-top: 44px; width: 940px; }
  #banner .panel { position: absolute; right: 112px; top: 178px; width: 720px; padding: 22px 44px; }
  #banner .row { padding: 22px 0; }
  #banner .doors { right: 980px; bottom: 96px; gap: 34px; padding: 0 20px; }

  /* social: 1280 x 640 */
  #social { width: 1280px; height: 640px; }
  #social .corner, #nexus .corner { width: 36px; height: 36px; left: 16px; top: 16px; }
  #social .corner.br, #nexus .corner.br { left: auto; top: auto; right: 16px; bottom: 16px; }
  #social .text { position: absolute; left: 80px; top: 92px; width: 1120px; }
  #social .kicker, #nexus .kicker { font-size: 17px; }
  #social .title, #nexus .title { font-size: 120px; margin: 22px 0 22px; }
  #social .tag, #nexus .tag { font-size: 30px; max-width: 680px; }
  #social .rule, #nexus .rule { margin-top: 26px; width: 560px; }
  #social .panel { position: absolute; left: 80px; right: 80px; top: 440px; display: flex; padding: 22px 22px; }
  #social .row, #nexus .row { flex: 1; display: block; padding: 0; font-size: 15px; }
  #social .row + .row, #nexus .row + .row { border-top: 0; }
  #social .row span, #nexus .row span { display: block; }
  #social .row span + span, #nexus .row span + span { margin-top: 8px; }
  #social .doors { right: 84px; top: 262px; gap: 18px; padding: 0 10px; }

  /* nexus: 1280 x 640, the social layout 55 px lower, leaving the top left for the EDGEmodders header
     the owner adds by hand (as on REDnode's packs) */
  #nexus { width: 1280px; height: 640px; }
  #nexus .text { position: absolute; left: 74px; top: 147px; width: 1120px; }
  #nexus .panel { position: absolute; left: 74px; right: 86px; top: 495px; display: flex; padding: 22px 22px; }
  #nexus .doors { right: 90px; top: 317px; gap: 18px; padding: 0 10px; }

  /* icon: 256 x 256 */
  #icon { width: 256px; height: 256px; clip-path: polygon(0 0, 214px 0, 256px 42px, 256px 256px, 42px 256px, 0 214px); }
  #icon .corner { width: 26px; height: 26px; border-width: 0; }
  #icon .corner.tl { left: 20px; top: 20px; border-left-width: 5px; border-top-width: 5px; }
  #icon .corner.br { right: 20px; bottom: 20px; border-right-width: 5px; border-bottom-width: 5px; }
  #icon .title { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-size: 92px; }
  #icon .doors { left: 50%; transform: translateX(-50%); bottom: 50px; gap: 14px; padding: 0 8px; }
</style>
</head>
<body>
<script>
  // Which image: ?kind=banner, social, nexus or icon (or the same as the URL's hash).
  const kind = new URLSearchParams(location.search).get('kind') || location.hash.slice(1) || 'banner';
  // Doorways of width w and height h: `picked` red, `gone` an empty dashed frame.
  const doors = (n, w, h, picked, gone) =>
    `<div class="doors">${Array.from({ length: n }, (_, i) => `<i class="${i === picked ? 'picked' : i === gone ? 'gone' : ''}" style="width:${w}px;height:${h}px"></i>`).join('')}</div>`;
  const rows = `
    <div class="row"><span>Doors near V</span><span class="c">Listed and outlined</span></div>
    <div class="row"><span>Remove</span><span class="r">Door and its stand-in</span></div>
    <div class="row"><span>Bring back</span><span class="g">Any time</span></div>`;
  const text = (kicker) => `
    <div class="text">
      <div class="kicker">${kicker}</div>
      <div class="title">Remove<b>Doors</b></div>
      <div class="tag">Take the game's doors out of Night City, and put them back whenever you like.</div>
      <div class="rule"></div>
    </div>`;
  const kicker = '// REDnode app · Cyberpunk 2077 PC';
  const art = {
    banner: `${text(kicker)}<div class="panel">${rows}</div>${doors(4, 92, 200, 1, 3)}`,
    social: `${text(kicker)}<div class="panel">${rows}</div>${doors(4, 54, 116, 1, 3)}`,
    nexus: `${text(kicker)}<div class="panel">${rows}</div>${doors(4, 54, 116, 1, 3)}`,
    icon: `<div class="title">R<b>D</b></div>${doors(3, 40, 74, 1, 2)}`,
  }[kind];
  document.body.innerHTML = `<div id="${kind}" class="art"><div class="corner tl"></div><div class="corner br"></div>${art}</div>`;
</script>
</body>
</html>
