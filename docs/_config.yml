# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# design.html is a standalone page and is served as-is.
# Built and deployed by .github/workflows/pages.yml.

title: EDGEbuilder
url: https://edgemodders.github.io
baseurl: /EDGEbuilder
repo: https://github.com/Edgemodders/EDGEbuilder

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: Scene format
    url: /scene.html
  - title: Tests
    url: /testing.html
  - title: B1 test
    url: /b1-test.html
  - title: B2a test
    url: /b2-test.html
  - title: B2b test
    url: /b2b-test.html
  - title: Study
    url: /study.html
  - title: Dev setup
    url: /dev-setup.html
